<template>
  <!-- WI-1.002 매물 카드 (MWI-1.002 목업 승계). data-testid 는 ACCEPTANCE-CRITERIA §1.6 규약 그대로 — 이름 변경 금지 -->
  <article
    class={cardClass}
    data-testid="property-card"
    data-id={property.Id}
    data-name={property.Name}
    tabindex="0"
    role="button"
    aria-pressed={ariaPressed}
    aria-label={ariaLabel}
    onclick={handleSelect}
    onkeydown={handleKeydown}
  >
    <img
      data-testid="property-card-image"
      class="property-card__image"
      src={imageUrl}
      alt={property.Name}
      onerror={handleImageError}
    />
    <div class="slds-p-around_small">
      <h3
        data-testid="property-card-name"
        class="slds-text-heading_small slds-truncate"
        title={property.Name}
      >
        {property.Name}
      </h3>
      {space}
      <p data-testid="property-card-price" class="property-card__price">
        <lightning-formatted-number
          value={property.Price__c}
          format-style="currency"
          currency-code="KRW"
          currency-display-as="symbol"
          maximum-fraction-digits="0"
        ></lightning-formatted-number>
      </p>
      {space}
      <p
        data-testid="property-card-address"
        class="slds-text-body_small slds-text-color_weak"
      >
        {addressLine}
      </p>
      {space}
      <p data-testid="property-card-rooms" class="slds-text-body_small">
        {rooms}
      </p>
      {space}
      <div class="slds-m-top_x-small">
        <span
          data-testid="property-status-badge"
          class={statusBadgeClass}
          data-status={property.Status__c}
        >
          {statusText}
        </span>
      </div>
    </div>
  </article>
</template>
